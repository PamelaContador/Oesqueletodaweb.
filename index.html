<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards de Mitos e Verdades</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Confere Aí</h1>
      <nav>
        <a href="#">Início</a>
      </nav>
    </header>
    <main>
      <h2>Descubra a verdade passando o mouse</h2>
      <section>
        <article>
          <div class="cartao-conteudo">
            <div class="cartao-frente">
              <img
                src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=800&q=80"
                alt="Cachorro"
                class="cartao-imagem"
              />
              <p>Cachorros enxergam apenas em preto e branco!</p>
            </div>
            <div class="cartao-verso">
              <img
                src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=800&q=80"
                alt="Cachorro"
                class="cartao-imagem"
              />
              <p>
                Mito! Os cães enxergam cores sim, mas em uma escala diferente
                dos humanos (principalmente tons de azul e amarelo).
              </p>
            </div>
          </div>
        </article>
      </section>
    </main>
    <footer>
      <p>Projeto feito por Pamela</p>
    </footer>
  </body>
</html>
